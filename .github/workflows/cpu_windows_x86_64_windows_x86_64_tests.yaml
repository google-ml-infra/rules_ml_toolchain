name: CI - CPU Windows x86_64 -> Windows x86_64 tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for main branch
  cancel-in-progress: ${{ github.ref != 'main' }}

jobs:
  run-tests:
    name: "CPU Windows x86_64 -> Windows x86_64 tests. Runner ${{ matrix.job_info.runner }}"
    defaults:
      run:
        # Explicitly set the shell to bash
        shell: bash
    strategy:
      matrix:
        job_info: [
          {
            runner: "windows-x86-n2-16",
            container: null,
          },
        ]
    runs-on: ${{ matrix.job_info.runner }}
    container:
      image: ${{ matrix.job_info.container }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: "Clang 22, MSVC | Testing..."
        run: |
          bazel --output_user_root=C:/_rmt test \
            --verbose_failures \
            --test_output=errors \
            --color=yes \
            --enable_runfiles \
            //cc/tests/cpu:all

      - name: "Bzlmod. Clang 22, MSVC | Testing..."
        run: |
          bazel --output_user_root=C:/_rmt test \
            --config=bzlmod \
            --verbose_failures \
            --test_output=errors \
            --color=yes \
            --enable_runfiles \
            //cc/tests/cpu:all
